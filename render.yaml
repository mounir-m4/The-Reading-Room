# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the API and built Vite client from one free web service.
services:
  - type: web
    name: the-reading-room
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MAIL_FROM
        value: "The Reading Room <hello@thereadingroom.test>"
      # CLIENT_URL is intentionally omitted: the server falls back to Render's
      # RENDER_EXTERNAL_URL, so CORS, sitemap and cookies use the live domain.
